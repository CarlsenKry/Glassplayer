name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # This static check is intentionally first: it can run even when Android
      # toolchain provisioning fails and never pretends to be a Kotlin build.
      - name: Run project self-check
        run: python3 scripts/selfcheck.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # This project uses the installed Gradle distribution rather than a
      # standard gradle-wrapper.jar. Pin the same version as gradlew scripts.
      - name: Set up Gradle 8.14.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.7'
          cache-provider: basic

      # v4 uses current command-line tools and does not request Google's
      # removed legacy SDK package named "tools".
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Verify build toolchain
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Run unit tests, lint and assemble debug APK
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: krypton-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: krypton-player-build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
